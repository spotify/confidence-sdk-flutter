name: Mobile builds
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: macos-latest
    strategy:
      matrix:
        platform: [android, ios-spm, ios-cocoapods]
    steps:
      - uses: actions/checkout@v6
      - name: Stage package without Git identity overrides
        run: python3 tool/stage_package.py "$RUNNER_TEMP/confidence_openfeature_provider"
      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: zulu
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
          channel: stable
      - if: matrix.platform == 'ios-cocoapods'
        run: flutter config --no-enable-swift-package-manager
      - run: flutter pub get
        working-directory: ${{ runner.temp }}/confidence_openfeature_provider/example
      - if: matrix.platform == 'android'
        run: flutter build apk --debug
        working-directory: ${{ runner.temp }}/confidence_openfeature_provider/example
      - if: matrix.platform != 'android'
        run: flutter build ios --simulator --debug
        working-directory: ${{ runner.temp }}/confidence_openfeature_provider/example
