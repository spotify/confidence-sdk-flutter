name: Dart provider

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/confidence_openfeature_provider
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
          channel: stable
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test tool/mobile_storage_probe
      - run: flutter analyze --fatal-infos
      - run: flutter test
