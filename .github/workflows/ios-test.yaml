name: Test-iOS
on:
  push:
    branches:
      - 'main'
  pull_request:
    branches:
      - '*'
jobs:
  ios-test:
    runs-on: macos-latest

    env:
      FLUTTER_CHANNEL: stable
      FLUTTER_VERSION: 3.27.3

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: fetch submodules
        run: git submodule update --init --recursive

      - name: Copy iOS
        working-directory: ios/Classes
        run: cp -r confidence-sdk/Sources/Confidence .

      - name: Remove the submodule
        working-directory: ios/Classes
        run: rm -rf confidence-sdk

      - name: Remove git submodule
        working-directory: ios/Classes
        run: git rm confidence-sdk

      - name: Select iOS simulator
        id: simulator
        run: |
          SIMULATOR=$(xcrun simctl list devices available -j | python3 .github/scripts/find-simulator.py iOS)
          echo "udid=$SIMULATOR" >> "$GITHUB_OUTPUT"
          echo "Using simulator: $SIMULATOR"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}

      - run: echo API_KEY=${{ secrets.TEST_API_KEY }} > example/.env
      - run: |
          xcrun simctl boot "${{ steps.simulator.outputs.udid }}" || true
          xcrun simctl bootstatus "${{ steps.simulator.outputs.udid }}" -b
          cd example && flutter drive -d "${{ steps.simulator.outputs.udid }}" --driver=test_drive/integration_test.dart --target=test/widget_test.dart
