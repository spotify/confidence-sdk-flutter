name: Test-iOS
on:
  push:
    branches:
      - 'main'
  pull_request:
    branches:
      - '*'
jobs:
  ios-test:
    runs-on: macos-latest
    timeout-minutes: 75

    env:
      FLUTTER_CHANNEL: stable
      FLUTTER_VERSION: 3.44.0

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Select iOS simulator
        id: simulator
        run: |
          SIMULATOR=$(xcrun simctl list devices available -j | python3 .github/scripts/find-simulator.py iOS)
          echo "udid=$SIMULATOR" >> "$GITHUB_OUTPUT"
          echo "Using simulator: $SIMULATOR"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}

      - run: echo API_KEY=${{ secrets.TEST_API_KEY }} > example/.env
      - name: Wait for iOS simulator
        run: xcrun simctl bootstatus "${{ steps.simulator.outputs.udid }}" -b
      - name: Configure CocoaPods
        run: flutter config --no-enable-swift-package-manager
      - name: Compare bridged and Dart SDKs
        id: parity
        timeout-minutes: 20
        run: bash scripts/test-parity.sh "${{ steps.simulator.outputs.udid }}"
      - name: Verify native app upgrades without losing data
        id: upgrade
        timeout-minutes: 20
        run: bash scripts/test-upgrade.sh "${{ steps.simulator.outputs.udid }}"
      # Keep main's bounded retry for intermittent Dart VM attach failures.
      # Allow both attempts alongside the parity and upgrade gates.
      - name: Run iOS integration tests
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 13
          max_attempts: 2
          command: cd example && flutter test -d "${{ steps.simulator.outputs.udid }}" integration_test/widget_test.dart

      - name: Upload parity and upgrade evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-parity-upgrade
          path: |
            ${{ steps.parity.outputs.parity_results }}
            ${{ steps.upgrade.outputs.upgrade_results }}
