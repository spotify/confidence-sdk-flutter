name: Test-iOS
on:
  push:
    branches:
      - 'main'
  pull_request:
    branches:
      - '*'
jobs:
  ios-test:
    runs-on: macos-latest
    timeout-minutes: 45

    env:
      FLUTTER_CHANNEL: stable
      FLUTTER_VERSION: 3.44.0

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Select iOS simulator
        id: simulator
        run: |
          SIMULATOR=$(xcrun simctl list devices available -j | python3 .github/scripts/find-simulator.py iOS)
          echo "udid=$SIMULATOR" >> "$GITHUB_OUTPUT"
          echo "Using simulator: $SIMULATOR"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}

      - run: echo API_KEY=${{ secrets.TEST_API_KEY }} > example/.env
      - name: Run iOS integration tests
        timeout-minutes: 30
        run: |
          flutter config --no-enable-swift-package-manager
          xcrun simctl boot "${{ steps.simulator.outputs.udid }}"
          cd example && flutter test -d "${{ steps.simulator.outputs.udid }}" integration_test/widget_test.dart
