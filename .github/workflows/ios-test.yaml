name: iOS integration
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Stage package without Git identity overrides
        run: python3 tool/stage_package.py "$RUNNER_TEMP/confidence_openfeature_provider"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
      - name: Select simulator
        id: simulator
        run: |
          simulator=$(xcrun simctl list devices available -j | python3 .github/scripts/find-simulator.py iOS)
          echo "udid=$simulator" >> "$GITHUB_OUTPUT"
          xcrun simctl bootstatus "$simulator" -b
      - run: flutter pub get
        working-directory: ${{ runner.temp }}/confidence_openfeature_provider/example
      - run: flutter test integration_test/mobile_test.dart -d '${{ steps.simulator.outputs.udid }}' --verbose
        working-directory: ${{ runner.temp }}/confidence_openfeature_provider/example
