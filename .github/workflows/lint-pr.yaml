name: 'Lint PR'

# The release-please bot opens and force-pushes its release PR with the default
# GITHUB_TOKEN. Bot-caused events never trigger pull_request_target workflows,
# so this check has never run on a release PR. pull_request workflows do fire
# on those same bot events (verified across every 2026 release cycle), so lint
# from pull_request instead.
#
# Deliberately NO `permissions:` block: explicitly requesting elevated
# permissions (pull-requests: write, used by the sticky comments) makes GitHub
# hold runs from non-collaborator actors for manual approval ("required
# approval but was not approved"), which would break this workflow on
# release-please's bot PRs all over again. The repository-default token
# suffices; on fork PRs it is read-only, so the sticky-comment steps below are
# non-fatal and can never mask the title validation itself.
on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize

jobs:
  main:
    name: Validate PR title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        id: lint_pr_title
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: marocchino/sticky-pull-request-comment@v3
        # When the previous steps fails, the workflow would stop. By adding this
        # condition you can continue the execution with the populated error message.
        # Commenting needs a writable token, which fork PRs don't provide in
        # pull_request context — never fail the check because of that.
        if: always() && (steps.lint_pr_title.outputs.error_message != null)
        continue-on-error: true
        with:
          header: pr-title-lint-error
          message: |
            Hey there and thank you for opening this pull request! 👋🏼
            
            We require pull request titles to follow the [Conventional Commits specification](https://www.conventionalcommits.org/en/v1.0.0/) and it looks like your proposed title needs to be adjusted.

            Details:
            
            ```
            ${{ steps.lint_pr_title.outputs.error_message }}
            ```

      # Delete a previous comment when the issue has been resolved
      - if: ${{ steps.lint_pr_title.outputs.error_message == null }}
        uses: marocchino/sticky-pull-request-comment@v3
        continue-on-error: true
        with:
          header: pr-title-lint-error
          delete: true
