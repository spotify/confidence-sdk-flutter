name: Bot Path Test (temporary)

# Temporary e2e verification for the lint-pr fix on this branch. Reproduces
# release-please's exact bot conditions with the default GITHUB_TOKEN: opens a
# throwaway PR, then pushes a commit onto its branch (the fold-in), using the
# same git data API mechanics release-please uses.
#
# APPROVAL GATE (discovered while testing, matches GitHub's fork-approval
# rules): pull_request runs on a PR authored by a non-collaborator — the bot
# included — are created as attempt 1 with conclusion 'action_required' and
# only execute once a maintainer approves them; approving starts the run as
# attempt 2. This is exactly what happens to the flutter checks on every
# release-please PR in this repo: maintainers approve the PR's workflows
# during release prep (e.g. PR #71 on 2026-11-02 08:02:15, 11s after the
# fold-in). This test therefore waits for a maintainer to approve the pending
# lint run (a local watcher approves it as nicklasl, the same gesture) and
# then asserts the approved run executed and FAILED 'Validate PR title' on the
# invalid title — the job, not just the run, must fail.
#
# The throwaway PR points at a bot-created base branch that already contains
# this branch's head, so the PR diff is a single empty commit (release PRs
# never modify workflow files). Assertions are scoped to the throwaway branch
# because its head SHA is shared with this PR. Cleans up its own artifacts
# (PR, both branches). REMOVE THIS FILE once the evidence is captured — the
# definitive real-world proof is the next release-please fold-in on main
# after the lint-pr fix merges.
#
# Launched by pushing to this branch: workflow_dispatch cannot target a
# workflow file that is not on the default branch (the API returns 404),
# while `push` runs the file as it exists on the pushed ref.

on:
  workflow_dispatch:
  push:
    branches:
      - nicklasl/fix-lint-pr-bot-trigger

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: bot-path-test
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      TMP_BRANCH: bot-path-test-${{ github.run_number }}
      BASE_BRANCH: bot-path-test-base-${{ github.run_number }}
      PR_TITLE: throwaway bot-path test ${{ github.run_number }} with invalid title
    steps:
      - name: Create base + throwaway branches (bot refs at this commit)
        run: |
          set -euo pipefail
          # Base branch: exactly this commit, so the throwaway PR's diff is
          # workflow-clean (release-please PRs never modify workflow files).
          gh api -X POST repos/spotify/confidence-sdk-flutter/git/refs \
            -f "ref=refs/heads/$BASE_BRANCH" \
            -f "sha=$GITHUB_SHA" --jq .ref
          # Throwaway branch: one empty commit on top, so the PR is non-empty.
          TREE=$(gh api "repos/spotify/confidence-sdk-flutter/git/commits/$GITHUB_SHA" --jq .tree.sha)
          FOLDIN_1=$(gh api -X POST repos/spotify/confidence-sdk-flutter/git/commits \
            -f "message=chore: bot-path test fold-in $GITHUB_RUN_NUMBER" \
            -f "tree=$TREE" \
            -F "parents[]=$GITHUB_SHA" \
            --jq .sha)
          gh api -X POST repos/spotify/confidence-sdk-flutter/git/refs \
            -f "ref=refs/heads/$TMP_BRANCH" \
            -f "sha=$FOLDIN_1" --jq .ref
          echo "FOLDIN_1=$FOLDIN_1" >> "$GITHUB_ENV"
          echo "base $BASE_BRANCH @ $GITHUB_SHA, head $TMP_BRANCH @ ${FOLDIN_1:0:8}"

      - name: Open PR via GITHUB_TOKEN (bot 'opened')
        run: |
          set -euo pipefail
          PR_NUMBER=$(gh api -X POST repos/spotify/confidence-sdk-flutter/pulls \
            -f "title=$PR_TITLE" \
            -f "head=$TMP_BRANCH" \
            -f "base=$BASE_BRANCH" \
            -f "body=Temporary throwaway PR opened with the default GITHUB_TOKEN to reproduce release-please's bot conditions for the lint-pr fix. Its base branch already contains the fixed workflow, so this PR's diff (like a real release PR's) touches no workflow files. Its lint run will sit 'action_required' until a maintainer approves it — the same approval the flutter checks on release PRs always need. Closed and deleted automatically by the test." \
            --jq .number)
          echo "PR_NUMBER=$PR_NUMBER" >> "$GITHUB_ENV"
          echo "Opened throwaway PR #$PR_NUMBER: $TMP_BRANCH -> $BASE_BRANCH (head $FOLDIN_1)"

      - name: Await maintainer approval, then assert failure (bot opened)
        run: |
          set -euo pipefail
          sha="$FOLDIN_1"
          phase="opened"
          status=""
          row=""
          for i in $(seq 1 30); do
            row=$(gh api "repos/spotify/confidence-sdk-flutter/actions/workflows/lint-pr.yaml/runs?branch=$TMP_BRANCH&event=pull_request&per_page=10" \
              --jq '.workflow_runs[] | [.head_sha, .id, .status, (.conclusion // "-")] | @tsv' 2>/dev/null \
              | awk -v s="$sha" '$1==s' | tail -1)
            if [ -n "$row" ]; then
              status=$(echo "$row" | cut -f3)
              concl=$(echo "$row" | cut -f4)
              echo "($phase) Lint PR run $(echo "$row" | cut -f2): status=$status conclusion=${concl:-none} (attempt $i/30)"
              if [ "$status" = "completed" ] && [ "$concl" != "action_required" ]; then break; fi
            else
              echo "($phase) waiting for Lint PR run on $TMP_BRANCH @ $sha (attempt $i/30)"
            fi
            sleep 20
          done
          if [ "$status" != "completed" ]; then
            echo "::error::($phase) Lint PR run never appeared on branch $TMP_BRANCH for head $sha"
            exit 1
          fi
          run_id=$(echo "$row" | cut -f2)
          conclusion=$(echo "$row" | cut -f4)
          echo "($phase) Lint PR run https://github.com/spotify/confidence-sdk-flutter/actions/runs/$run_id -> $conclusion"
          job_concl=$(gh api "repos/spotify/confidence-sdk-flutter/actions/runs/$run_id/jobs" \
            --jq '[.jobs[] | select(.name=="Validate PR title")][0].conclusion // "none"')
          if [ "$job_concl" != "failure" ]; then
            echo "::error::($phase) job 'Validate PR title' missing or not failed (got '$job_concl') — the run was never approved or never validated"
            exit 1
          fi
          echo "($phase) job 'Validate PR title' completed with conclusion: $job_concl"

      - name: Push fold-in commit via GITHUB_TOKEN (bot 'synchronize')
        run: |
          set -euo pipefail
          TREE=$(gh api "repos/spotify/confidence-sdk-flutter/git/commits/$FOLDIN_1" --jq .tree.sha)
          FOLDIN_2=$(gh api -X POST repos/spotify/confidence-sdk-flutter/git/commits \
            -f "message=chore: bot-path test fold-in $GITHUB_RUN_NUMBER (2)" \
            -f "tree=$TREE" \
            -F "parents[]=$FOLDIN_1" \
            --jq .sha)
          gh api -X PATCH "repos/spotify/confidence-sdk-flutter/git/refs/heads/$TMP_BRANCH" \
            -f "sha=$FOLDIN_2" --jq .object.sha > /dev/null
          echo "FOLDIN_2=$FOLDIN_2" >> "$GITHUB_ENV"
          echo "Bot-pushed fold-in $FOLDIN_2 onto $TMP_BRANCH (parent $FOLDIN_1)"

      - name: Await maintainer approval, then assert failure (bot synchronize)
        run: |
          set -euo pipefail
          sha="$FOLDIN_2"
          phase="synchronize"
          status=""
          row=""
          for i in $(seq 1 30); do
            row=$(gh api "repos/spotify/confidence-sdk-flutter/actions/workflows/lint-pr.yaml/runs?branch=$TMP_BRANCH&event=pull_request&per_page=10" \
              --jq '.workflow_runs[] | [.head_sha, .id, .status, (.conclusion // "-")] | @tsv' 2>/dev/null \
              | awk -v s="$sha" '$1==s' | tail -1)
            if [ -n "$row" ]; then
              status=$(echo "$row" | cut -f3)
              concl=$(echo "$row" | cut -f4)
              echo "($phase) Lint PR run $(echo "$row" | cut -f2): status=$status conclusion=${concl:-none} (attempt $i/30)"
              if [ "$status" = "completed" ] && [ "$concl" != "action_required" ]; then break; fi
            else
              echo "($phase) waiting for Lint PR run on $TMP_BRANCH @ $sha (attempt $i/30)"
            fi
            sleep 20
          done
          if [ "$status" != "completed" ]; then
            echo "::error::($phase) Lint PR run never appeared on branch $TMP_BRANCH for head $sha"
            exit 1
          fi
          run_id=$(echo "$row" | cut -f2)
          conclusion=$(echo "$row" | cut -f4)
          echo "($phase) Lint PR run https://github.com/spotify/confidence-sdk-flutter/actions/runs/$run_id -> $conclusion"
          job_concl=$(gh api "repos/spotify/confidence-sdk-flutter/actions/runs/$run_id/jobs" \
            --jq '[.jobs[] | select(.name=="Validate PR title")][0].conclusion // "none"')
          if [ "$job_concl" != "failure" ]; then
            echo "::error::($phase) job 'Validate PR title' missing or not failed (got '$job_concl') — the run was never approved or never validated"
            exit 1
          fi
          echo "($phase) job 'Validate PR title' completed with conclusion: $job_concl"

      - name: Report sticky failure comment presence (informational)
        run: |
          present=no
          for i in $(seq 1 12); do
            n=$(gh api "repos/spotify/confidence-sdk-flutter/issues/$PR_NUMBER/comments" \
              --jq 'map(select(.body | contains("Conventional Commits specification"))) | length' 2>/dev/null || echo 0)
            if [ "${n:-0}" != "0" ]; then present=yes; break; fi
            sleep 10
          done
          echo "sticky pr-title-lint-error comment on throwaway PR #$PR_NUMBER: $present"
          echo "(informational: posting requires a writable token; the check verdict asserted above is authoritative)"

      - name: Cleanup throwaway PR and branches
        if: always()
        run: |
          set -euo pipefail
          if [ -n "${PR_NUMBER:-}" ]; then
            gh api -X PATCH "repos/spotify/confidence-sdk-flutter/pulls/$PR_NUMBER" \
              -f state=closed --jq .state > /dev/null || true
          fi
          gh api -X DELETE "repos/spotify/confidence-sdk-flutter/git/refs/heads/$TMP_BRANCH" || true
          gh api -X DELETE "repos/spotify/confidence-sdk-flutter/git/refs/heads/$BASE_BRANCH" || true
          echo "cleaned up PR #${PR_NUMBER:-none}, branches $TMP_BRANCH and $BASE_BRANCH"
